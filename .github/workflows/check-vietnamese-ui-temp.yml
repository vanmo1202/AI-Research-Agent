name: Check Vietnamese UI (temporary)
# Verify unique mobile menu controls
on:
  push:
    branches: [feature/horizontal-top-navigation-20261113]
    paths: ['.github/workflows/check-vietnamese-ui-temp.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chrome
        working-directory: frontend
      - run: npx playwright test -c playwright.rebuild.config.js --grep 'global search is a keyboard accessible dialog'
        working-directory: frontend
