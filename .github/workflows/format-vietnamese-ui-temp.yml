name: Format Vietnamese UI (temporary)
on:
  push:
    branches: [feature/horizontal-top-navigation-20261113]
    paths: ['.github/workflows/format-vietnamese-ui-temp.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Format frontend files
        run: npx prettier --write src tests
        working-directory: frontend
      - name: Commit formatting to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src frontend/tests
          if ! git diff --cached --quiet; then
            git commit -m "style(frontend): format Vietnamese UI translations"
            git push origin HEAD:refs/heads/feature/horizontal-top-navigation-20261113
          fi
