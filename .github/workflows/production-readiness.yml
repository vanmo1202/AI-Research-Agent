name: Production readiness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: researchos
          POSTGRES_DB: researchos_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U researchos -d researchos_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: researchos
      PGDATABASE: researchos_test_ci
      RESEARCH_LOAD_ENV: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm audit --omit=dev
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chrome
        working-directory: frontend
      - run: npm run test:rebuild
        working-directory: frontend
      - run: npx playwright test -c playwright.unified.config.js
        working-directory: frontend
      - run: npx playwright test -c playwright.analytics.config.js
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: frontend/test-results
          retention-days: 7
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate config with isolated placeholder environment
        env:
          INTERNAL_API_KEY: ci-placeholder-not-for-production
        run: |
          touch backend/.env
          mkdir -p deploy/secrets
          printf '%s' 'ci-fake-secret-not-for-production' > deploy/secrets/postgres_password
          docker compose -p ai-research-agent config --quiet
          docker compose -p ai-research-agent -f docker-compose.yml -f docker-compose.validation.yml config --quiet
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: gpg --version
      - run: python3 -m unittest discover -s scripts/ops -p 'test_*.py' -v
      - name: Validate hardened staging topology (placeholder digests, no image execution)
        env:
          COMPOSE_PROJECT_NAME: ci-hardening
          FRONTEND_ORIGIN: https://ci.example.invalid
          INTERNAL_RESEARCH_USER_ID: ci-service-user
          BACKEND_IMAGE: backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          FRONTEND_IMAGE: frontend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          EDGE_IMAGE: nginx@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_IMAGE: postgres:18-alpine
          N8N_IMAGE: n8n@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TLS_DIRECTORY: /tmp/ci-hardening/tls
          SECRETS_DIRECTORY: /tmp/ci-hardening/secrets
        run: |
          mkdir -p /tmp/ci-hardening/tls /tmp/ci-hardening/secrets
          for name in internal_api_key gemini_api_key tavily_api_key n8n_encryption_key postgres_password; do
            printf '%s' 'ci-fake-secret-not-for-production' > "/tmp/ci-hardening/secrets/$name"
          done
          docker compose -p ai-research-agent -f compose.production.yml -f compose.staging.yml config --quiet
          docker compose -p ai-research-agent -f compose.production.yml -f compose.staging.yml config --format json | python3 scripts/ops/preflight.py
