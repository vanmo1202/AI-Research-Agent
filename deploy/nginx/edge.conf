pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    limit_req_zone $binary_remote_addr zone=auth:1m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:2m rate=5r/s;
    server {
        listen 8443 ssl default_server;
        server_name _;
        ssl_certificate /run/tls/fullchain.pem;
        ssl_certificate_key /run/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        # Restricted release until durable application quotas are implemented.
        ssl_client_certificate /run/tls/client-ca.pem;
        ssl_verify_client on;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        client_max_body_size 21m;
        client_body_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_set_header Host $http_host;
        # Never accept client-supplied forwarding headers at the Internet boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        location /internal { return 404; }
        location /webhook { return 404; }
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://frontend:8080;
        }
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://frontend:8080;
        }
        location / { proxy_pass http://frontend:8080; }
    }
}
