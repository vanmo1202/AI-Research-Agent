function render(){document.getElementById('app').innerHTML=`<div class="app">${buildSidebar()}<div class="main">${buildHeader()}<main class="content" id="main-content">${view==='home'?homePage():page()}</main></div></div>`;document.title=(view==='home'?'Tổng quan':({research:'Nghiên cứu',sessions:'Các phiên nghiên cứu',workflows:'5 workflow',evidence:'Phân tích bằng chứng',reports:'Báo cáo',documents:'Tài liệu',chat:'Chat tài liệu',memory:'Agent Memory',automations:'Tự động hóa',analytics:'Thống kê',settings:'Cài đặt',help:'Trợ giúp',detail:'Chi tiết nghiên cứu'}[view]||'ResearchOS'))+' — ResearchOS Demo';if(view==='chat'){const msg=document.querySelector('.chat-messages');if(msg)msg.scrollTop=msg.scrollHeight}}
function header(title,ico,action='',subtitle=''){return `<div class="card-header"><span class="card-icon">${icon(ico)}</span><h2>${title}</h2><div class="push"></div>${action}</div>${subtitle?`<p class="card-subtitle">${subtitle}</p>`:''}`}
function recentRows(){return db.sessions.slice(0,3).map(s=>`<button class="recent-row" onclick="ui.detail(${s.id})"><img class="thumb" src="${s.image||'thumb2.webp'}" alt="Ảnh minh họa nghiên cứu"/><div class="recent-info"><div class="recent-title">${esc(s.title)}</div><div class="recent-meta">▢ ${esc(s.date)} ・ ${s.sources} nguồn</div></div><span class="pill ${s.status==='done'?'done':'running'}">${icon('check')} ${s.status==='done'?'Hoàn thành':'Đang thực hiện'}</span>${icon('dots')}</button>`).join('')}
function knowledgeItems(){return [{label:`${count('documents')} tài liệu`,desc:'PDF, tài liệu nghiên cứu, báo cáo...',ico:'file',bg:'#e2f5ff',color:'#168dce',page:'documents'},{label:'Chat với tài liệu',desc:'Hỏi đáp, trích dẫn, tóm tắt nhanh',ico:'message',bg:'#f0eaff',color:'#7451c6',page:'chat'},{label:'Bộ nhớ (Memory)',desc:`${count('memory')} mục tri thức đã được duyệt`,ico:'database',bg:'#fff2e3',color:'#dd810d',page:'memory'}].map(it=>`<button class="knowledge-item" onclick="ui.go('${it.page}')"><span class="knowledge-symbol" style="background:${it.bg};color:${it.color}">${icon(it.ico)}</span><span class="knowledge-text"><strong>${it.label}</strong><span>${it.desc}</span></span><span class="knowledge-arr">${icon('right')}</span></button>`).join('')}
function activityRows(){return db.activities.slice(0,4).map(a=>`<div class="activity"><span class="activity-icon ${a.type}">${icon(a.type==='green'?'check':a.type==='orange'?'database':a.type==='violet'?'message':'search')}</span><div class="activity-body"><div class="activity-title">${esc(a.title)}</div><div class="activity-detail">${esc(a.detail)}</div></div><div class="activity-time">${esc(a.time)}</div></div>`).join('')}
function workflowCards(){return workflows.map((w,i)=>`<article class="workflow-card" style="--wbg:${w.bg};--wborder:${w.border};--wcolor:${w.color};--wbadge:${w.badge}"><span class="workflow-num">${i+1}</span><div class="workflow-symbol">${icon(w.icon)}</div><h3>${w.title}</h3><p>${w.detail}</p><button onclick="ui.go('${w.page}')">Bắt đầu →</button></article>`).join('')}
function homePage(){return `<section class="hero"><div class="hero-art" aria-hidden="true"></div><div class="hero-inside"><h1 class="hero-title">👋 Chào mừng trở lại, Mo van!</h1><p class="hero-desc">Tiếp tục nghiên cứu, khai thác tri thức và tạo báo cáo chuyên sâu.</p><div class="stats"><div class="stat"><span class="stat-icon">${icon('folder')}</span><div class="stat-copy"><div class="stat-label">Nghiên cứu</div><div class="stat-line"><strong class="stat-number">${count('research')}</strong><span class="trend">↗ +3 tuần này</span></div></div></div><div class="stat"><span class="stat-icon">${icon('file')}</span><div class="stat-copy"><div class="stat-label">Tài liệu</div><div class="stat-line"><strong class="stat-number">${count('documents')}</strong><span class="trend">↗ +12</span></div></div></div><div class="stat"><span class="stat-icon">${icon('message')}</span><div class="stat-copy"><div class="stat-label">Phiên chat</div><div class="stat-line"><strong class="stat-number">${count('chats')}</strong><span class="trend">↗ +24</span></div></div></div><div class="stat"><span class="stat-icon">${icon('database')}</span><div class="stat-copy"><div class="stat-label">Bộ nhớ (Memory)</div><div class="stat-line"><strong class="stat-number">${count('memory')}</strong><span class="trend">↗ +2</span></div></div></div></div></div></section><div class="dashboard-grid"><div class="left-stack"><section class="card workflows-panel">${header('5 Luồng làm việc (Workflows)','layers',`<button class="text-link" onclick="ui.go('workflows')">Xem chi tiết workflows →</button>`,'Quy trình nghiên cứu từ ý tưởng đến báo cáo, kết hợp tri thức và trợ lý AI.')}<div class="workflow-list">${workflowCards()}</div></section><div class="lower-grid"><section class="card compact-card">${header('Nghiên cứu gần đây','clock',`<button class="text-link" onclick="ui.go('sessions')">Xem tất cả →</button>`)}<div class="recent-list">${recentRows()}</div></section><section class="card compact-card">${header('Không gian tri thức','book',`<button class="text-link" onclick="ui.go('documents')">→</button>`)}<div class="knowledge-list">${knowledgeItems()}</div></section></div></div><div class="right-stack"><section class="card">${header('Hoạt động gần đây','activity')}<div class="activity-list">${activityRows()}</div></section><section class="card">${header('Truy cập nhanh','bolt')}<div class="quick-grid"><button class="quick" onclick="ui.newResearch()">${icon('plus')}Nghiên cứu mới</button><button class="quick qgreen" onclick="ui.upload()">${icon('upload')}Tải lên PDF</button><button class="quick qpurple" onclick="ui.go('chat')">${icon('message')}Chat với tài liệu</button><button class="quick qorange" onclick="ui.go('reports')">${icon('file')}Xem báo cáo</button></div></section></div></div>`}
const heading=(tag,title,description,cta='')=>`<div class="page-heading"><div><div class="eyebrow">RESEARCHOS WORKSPACE <span class="demo-chip">DEMO</span></div><h1>${title}</h1><p>${description}</p></div>${cta}</div>`;
function page(){switch(view){case 'workflows':return workflowsPage();case 'research':case 'sessions':return sessionsPage();case 'detail':return detailPage();case 'evidence':return evidencePage();case 'reports':return reportsPage();case 'documents':return documentsPage();case 'chat':return chatPage();case 'memory':return memoryPage();case 'automations':return automationsPage();case 'analytics':return analyticsPage();case 'settings':return settingsPage();case 'help':return helpPage();default:return homePage()}}
function workflowsPage(){return `<section class="subpage">${heading('workflow','5 luồng làm việc','Chọn một bước để thao tác thử; ResearchOS kết nối quá trình nghiên cứu, bằng chứng, báo cáo và tri thức.',`<button class="primary" onclick="ui.newResearch()">${icon('plus')} Bắt đầu nghiên cứu</button>`)}<div class="tile-grid">${workflows.map((w,i)=>`<div class="card tile" style="border-top:4px solid ${w.color}"><div class="tile-top"><div style="color:${w.color}">${icon(w.icon)}</div><span class="pill running">Luồng ${String(i+1).padStart(2,'0')}</span></div><h3>${w.title}</h3><p>${w.detail}</p><div class="tile-footer"><span class="tile-meta">Mở chức năng</span><button class="secondary btn-sm" onclick="ui.go('${w.page}')">Truy cập ${icon('right')}</button></div></div>`).join('')}</div><div class="card panel-pad" style="margin-top:16px"><h3 class="section-title">Tự động hóa n8n và các workflow backend</h3><p class="muted">Phần giao diện này nhóm 5 chức năng người dùng theo ảnh mẫu. Những lịch chạy, job nền và cấu hình n8n được quản lý tại mục Tự động hóa; demo chưa kết nối API thật.</p><button class="secondary" onclick="ui.go('automations')">${icon('workflow')} Xem tự động hóa n8n</button></div></section>`}
function sessionsPage(){let ss=db.sessions.filter(s=>sessionFilter==='all'||(sessionFilter==='done'&&s.status==='done')||(sessionFilter==='running'&&s.status==='running'));return `<section class="subpage">${heading('research','Phiên nghiên cứu','Tạo một chủ đề mới, theo dõi tiến độ và mở lại các phiên làm việc.',`<button class="primary" onclick="ui.newResearch()">${icon('plus')} Nghiên cứu mới</button>`)}<div class="toolbar"><div class="tabs">${[['all','Tất cả'],['running','Đang thực hiện'],['done','Hoàn thành']].map(x=>`<button class="tab ${sessionFilter===x[0]?'active':''}" onclick="ui.sessionFilter('${x[0]}')">${x[1]}</button>`).join('')}</div><button class="ghost btn-sm" onclick="ui.go('evidence')">${icon('layers')} Phân tích bằng chứng</button></div><div class="tile-grid">${ss.length?ss.map(s=>`<article class="card tile"><div class="tile-top"><span class="pill ${s.status==='done'?'done':'running'}">${icon(s.status==='done'?'check':'clock')} ${s.status==='done'?'Hoàn thành':'Đang thực hiện'}</span><span class="muted" style="font-size:11px">${esc(s.date)}</span></div><h3>${esc(s.title)}</h3><p>${esc(s.topic)} • ${s.sources} nguồn đã thu thập</p><div class="progress" style="margin-bottom:15px"><div style="width:${Math.min(100,(s.stage+1)*25)}%"></div></div><div class="tile-footer"><span class="tile-meta">${Math.min(100,(s.stage+1)*25)}% tiến độ</span><button class="secondary btn-sm" onclick="ui.detail(${s.id})">Mở nghiên cứu ${icon('right')}</button></div></article>`).join(''):`<div class="card empty">Chưa có phiên nghiên cứu phù hợp.</div>`}</div></section>`}
function detailPage(){let s=db.sessions.find(x=>x.id===selectedSession)||db.sessions[0];let steps=[['Lập kế hoạch & thu thập nguồn','Xác định câu hỏi và thu thập tài liệu liên quan'],['Phân tích bằng chứng','Phân loại, đánh giá độ tin cậy của các nguồn'],['Tạo báo cáo','Viết và trích dẫn kết quả nghiên cứu'],['Hoàn thiện & lưu trữ','Xuất báo cáo hoặc lưu vào workspace']];return `<section class="subpage">${heading('detail',esc(s.title),`Chủ đề: ${esc(s.topic)} • ${s.sources} nguồn • Khởi tạo ${esc(s.date)}`,`<button class="ghost" onclick="ui.go('sessions')">${icon('back')} Trở lại</button>`)}<div class="two-col"><div class="card panel-pad"><h3 class="section-title">Tiến trình nghiên cứu</h3><div class="progress" style="margin-bottom:18px"><div style="width:${(s.stage+1)*25}%"></div></div><div class="checklist">${steps.map((a,i)=>`<div class="step ${i<s.stage?'completed':i===s.stage?'current':''}"><div class="step-num">${i<s.stage?icon('check'):i+1}</div><div><strong>${a[0]}</strong><small>${a[1]}</small></div></div>`).join('')}</div><div class="toolbar" style="margin:18px 0 0"><button class="primary" onclick="ui.advance(${s.id})">${icon(s.stage>=3?'file':'play')} ${s.stage>=3?'Xem báo cáo':'Hoàn thành bước hiện tại'}</button><button class="secondary" onclick="ui.go('evidence')">${icon('layers')} Bằng chứng</button></div></div><div class="card panel-pad"><h3 class="section-title">Thông tin phiên</h3><p class="muted">Bản demo cho phép cập nhật trạng thái bằng thao tác trên giao diện. Chức năng AI và tìm kiếm nguồn thực tế cần kết nối backend.</p><div class="settings-row"><strong>Nguồn tham khảo</strong><strong>${s.sources}</strong></div><div class="settings-row"><strong>Tiến độ</strong><span class="pill ${s.status==='done'?'done':'running'}">${(s.stage+1)*25}%</span></div><div class="settings-row"><strong>Trạng thái</strong><span class="pill ${s.status==='done'?'done':'running'}">${s.status==='done'?'Hoàn thành':'Đang thực hiện'}</span></div><button class="ghost" style="margin-top:20px" onclick="ui.go('documents')">${icon('book')} Mở thư viện tài liệu</button></div></div></section>`}
const evidenceRecords=[{source:'A Systematic Review of AI in Higher Education',type:'Bài báo học thuật',quality:'Cao',citations:46},{source:'Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks',type:'Nghiên cứu khoa học',quality:'Cao',citations:82},{source:'Báo cáo AI trong giáo dục năm 2026',type:'Báo cáo chuyên đề',quality:'Trung bình',citations:18},{source:'Thống kê chuyển đổi số tại các trường đại học',type:'Dữ liệu thống kê',quality:'Cao',citations:27}];
function evidencePage(){return `<section class="subpage">${heading('evidence','Phân tích bằng chứng','Theo dõi nguồn, phân loại tài liệu và đánh giá độ tin cậy trước khi tổng hợp báo cáo.',`<button class="primary" onclick="ui.mockAnalyze()">${icon('spark')} Phân tích thử</button>`)}<div class="metric-grid"><div class="card metric"><small>Nguồn thu thập</small><strong>46</strong><span class="pill running">Tất cả</span></div><div class="card metric"><small>Nguồn chất lượng cao</small><strong>32</strong><span class="pill done">Tin cậy</span></div><div class="card metric"><small>Trích dẫn</small><strong>173</strong><span class="pill running">Đã liên kết</span></div><div class="card metric"><small>Nguồn cần xác minh</small><strong>4</strong><span class="pill paused">Cần xem</span></div></div><div class="card"><div class="card-header"><h2>Danh mục bằng chứng</h2><div class="push"></div><button class="text-link" onclick="ui.go('reports')">Chuyển sang báo cáo →</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Tiêu đề / nguồn</th><th>Loại</th><th>Độ tin cậy</th><th>Trích dẫn</th><th>Thao tác</th></tr></thead><tbody>${evidenceRecords.map((e,i)=>`<tr><td class="name">${esc(e.source)}</td><td>${e.type}</td><td><span class="pill ${e.quality==='Cao'?'done':'paused'}">${e.quality}</span></td><td>${e.citations}</td><td><button class="secondary btn-sm" onclick="ui.evidence(${i})">Chi tiết</button></td></tr>`).join('')}</tbody></table></div></div></section>`}
function reportsPage(){return `<section class="subpage">${heading('reports','Báo cáo nghiên cứu','Xem báo cáo, mở nội dung mẫu và xuất bản Markdown để kiểm tra giao diện.',`<button class="primary" onclick="ui.createReport()">${icon('plus')} Tạo báo cáo</button>`)}<div class="tile-grid">${db.reports.map(r=>`<article class="card tile"><div class="tile-top"><div class="doc-icon">${icon('file')}</div><span class="pill done">${icon('check')} Sẵn sàng</span></div><h3>${esc(r.title)}</h3><p>Ngày tạo: ${esc(r.date)} • Đã tổng hợp và chuẩn bị nội dung minh họa.</p><div class="tile-footer"><button class="ghost btn-sm" onclick="ui.report(${r.id})">${icon('book')} Xem</button><button class="secondary btn-sm" onclick="ui.downloadReport(${r.id})">${icon('download')} Xuất .md</button></div></article>`).join('')}</div></section>`}
function documentsPage(){return `<section class="subpage">${heading('documents','Thư viện tài liệu PDF','Quản lý tài liệu trong Knowledge Workspace, kiểm tra trạng thái xử lý và chọn tài liệu để hỏi đáp.',`<button class="primary" onclick="ui.upload()">${icon('upload')} Tải lên PDF</button>`)}<div class="dropzone" id="dropzone" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="ui.drop(event)"><div style="color:#3977dc">${icon('upload')}</div><h3 style="font-size:15px;margin:7px 0 3px">Kéo thả tài liệu PDF vào đây</h3><p>Hoặc chọn file từ máy tính để mô phỏng việc upload và lập chỉ mục.</p><button class="secondary btn-sm" onclick="ui.pickFile()">${icon('folder')} Chọn file PDF</button></div><div class="document-grid">${db.docs.map(d=>`<article class="card doc-card"><div class="doc-icon">${icon('file')}</div><div class="doc-title">${esc(d.name)}</div><div class="doc-meta">${esc(d.size)} • ${esc(d.date)} • ${d.chunks} chunks</div><span class="pill done" style="width:max-content">${icon('check')} Đã xử lý (mô phỏng)</span><div class="toolbar" style="margin:2px 0 0"><button class="secondary btn-sm" onclick="ui.selectDoc(${d.id})">${icon('message')} Hỏi tài liệu</button><button class="ghost btn-sm" onclick="ui.docInfo(${d.id})">Chi tiết</button></div></article>`).join('')}</div><p class="small-note">Lưu ý: demo chỉ lưu tên và kích thước tệp vào bộ nhớ trình duyệt; không tải nội dung PDF lên server hay chạy OCR/RAG thật.</p></section>`}
function chatPage(){return `<section class="subpage">${heading('chat','Chat với tài liệu (RAG)','Đặt câu hỏi theo từng tài liệu hoặc toàn bộ Knowledge Workspace; câu trả lời và trích dẫn ở đây là dữ liệu minh họa.')}<section class="card chat-shell"><aside class="chat-side"><h3>Phạm vi tài liệu</h3><button class="${selectedDoc==='all'?'active':''}" onclick="ui.chatDoc('all')">${icon('book')} Toàn bộ tài liệu</button>${db.docs.map(d=>`<button title="${esc(d.name)}" class="${selectedDoc===d.id?'active':''}" onclick="ui.chatDoc(${d.id})">${icon('file')} ${esc(d.name.length>25?d.name.slice(0,24)+'…':d.name)}</button>`).join('')}</aside><div class="chat-main"><div class="chat-banner">${selectedDoc==='all'?'Chat trong Knowledge Workspace':esc((db.docs.find(d=>d.id===selectedDoc)||{}).name||'Tài liệu')}<small>Trợ lý RAG • Chế độ mô phỏng (không gọi AI thật)</small></div><div class="chat-messages">${db.messages.map(m=>`<div class="bubble-row ${m.role==='you'?'you':''}"><div class="bubble-avatar">${icon(m.role==='you'?'folder':'spark')}</div><div class="bubble">${esc(m.text)}${m.role==='bot'&&m.cite?`<div class="citations"><span class="source-chip">[1] ${esc(m.cite)}</span><span class="source-chip">Trích dẫn mẫu</span></div>`:''}</div></div>`).join('')}</div><form class="chat-compose" onsubmit="ui.sendChat(event)"><textarea id="chat-input" aria-label="Nhập câu hỏi" placeholder="Hỏi về nội dung tài liệu... (Enter để gửi, Shift+Enter xuống dòng)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit()}"></textarea><button class="primary" type="submit">${icon('send')} Gửi</button></form></div></section></section>`}
function memoryPage(){let mm=db.memories.filter(m=>memoryFilter==='all'||m.status===memoryFilter);return `<section class="subpage">${heading('memory','Bộ nhớ nghiên cứu (Agent Memory)','Lưu tri thức có kiểm duyệt; chỉ những ghi nhớ đã được duyệt mới được đánh dấu là có thể sử dụng lại.',`<button class="primary" onclick="ui.newMemory()">${icon('plus')} Thêm ghi nhớ</button>`)}<div class="toolbar"><div class="tabs">${[['all','Tất cả'],['pending','Chờ duyệt'],['approved','Đã duyệt']].map(x=>`<button class="tab ${memoryFilter===x[0]?'active':''}" onclick="ui.memoryFilter('${x[0]}')">${x[1]} (${x[0]==='all'?db.memories.length:db.memories.filter(m=>m.status===x[0]).length})</button>`).join('')}</div></div><div class="memory-list">${mm.length?mm.map(m=>`<article class="card memory-item"><div class="memory-icon">${icon('brain')}</div><div style="flex:1;min-width:0"><h3>${esc(m.title)}</h3><p>${esc(m.description)}</p><div class="memory-buttons"><span class="pill ${m.status==='approved'?'done':'paused'}">${m.status==='approved'?'Đã duyệt':'Chờ duyệt'}</span><small class="muted">${esc(m.date)}</small>${m.status==='pending'?`<button class="secondary btn-sm" onclick="ui.approve(${m.id})">${icon('check')} Duyệt</button><button class="danger btn-sm" onclick="ui.reject(${m.id})">${icon('trash')} Loại bỏ</button>`:`<button class="ghost btn-sm" onclick="ui.unapprove(${m.id})">Thu hồi duyệt</button>`}</div></div></article>`).join(''):`<div class="card empty">Không có ghi nhớ nào trong nhóm này.</div>`}</div></section>`}
function automationsPage(){return `<section class="subpage">${heading('automations','Tự động hóa (n8n)','Quản lý lịch thực thi và theo dõi các tác vụ tự động; trạng thái trong demo là mô phỏng.',`<button class="primary" onclick="ui.newSchedule()">${icon('plus')} Tạo lịch chạy</button>`)}<div class="card panel-pad" style="margin-bottom:15px;display:flex;gap:12px;align-items:center"><span style="color:#e49a16">${icon('bolt')}</span><div><strong style="font-size:13px">Kết nối n8n: Chưa thiết lập</strong><p class="muted" style="font-size:11px;margin:3px 0 0">Demo không gửi webhook hoặc thực thi workflow n8n trên server.</p></div><button style="margin-left:auto" class="secondary btn-sm" onclick="ui.go('settings')">Cấu hình</button></div><div style="display:flex;flex-direction:column;gap:10px">${db.schedules.map(a=>`<article class="card schedule-card"><div class="schedule-mark">${icon('calendar')}</div><div class="schedule-info"><strong>${esc(a.title)}</strong><p>${esc(a.frequency)} ・ Chạy gần nhất: ${esc(a.lastRun)}</p></div><button class="secondary btn-sm" onclick="ui.runSchedule(${a.id})">${icon('play')} Chạy thử</button><input type="checkbox" class="switch" aria-label="Bật tắt ${esc(a.title)}" ${a.enabled?'checked':''} onchange="ui.toggleSchedule(${a.id},this.checked)" /></article>`).join('')}</div></section>`}
function analyticsPage(){const vals=[32,53,44,62,76,64,88];return `<section class="subpage">${heading('analytics','Thống kê & hoạt động','Tổng quan sản phẩm với số liệu minh họa và các tương tác đã thực hiện trên bản demo.')}<div class="metric-grid"><div class="card metric"><small>Phiên nghiên cứu</small><strong>${count('research')}</strong><span class="pill running">↗ Đang tăng</span></div><div class="card metric"><small>Tài liệu</small><strong>${count('documents')}</strong><span class="pill done">PDF</span></div><div class="card metric"><small>Phiên chat</small><strong>${count('chats')}</strong><span class="pill running">Hỏi đáp</span></div><div class="card metric"><small>Memory</small><strong>${count('memory')}</strong><span class="pill done">Đã duyệt</span></div></div><div class="two-col"><div class="card panel-pad"><h3 class="section-title">Lượt hoạt động — tuần này (minh họa)</h3><div class="bars">${vals.map((v,i)=>`<div class="bar-col"><div class="bar" style="height:${v}%"></div><span>${['T2','T3','T4','T5','T6','T7','CN'][i]}</span></div>`).join('')}</div></div><div class="card">${header('Nhật ký hoạt động','activity')}<div class="activity-list">${activityRows()}</div></div></div></section>`}
function settingsPage(){return `<section class="subpage">${heading('settings','Cài đặt giao diện','Tùy chọn bản demo được lưu cục bộ trong trình duyệt.')}<div class="card panel-pad" style="max-width:750px"><h3 class="section-title">Tùy chọn ResearchOS</h3><div class="settings-row"><div><strong>Thông báo giao diện</strong><p>Hiển thị thông báo khi thao tác thành công trong bản demo.</p></div><input type="checkbox" class="switch" ${db.prefs.notify?'checked':''} onchange="ui.pref('notify',this.checked)" /></div><div class="settings-row"><div><strong>Chế độ khoảng cách nhỏ</strong><p>Thu gọn khoảng cách nội dung khi hiển thị.</p></div><input type="checkbox" class="switch" ${db.prefs.compact?'checked':''} onchange="ui.pref('compact',this.checked)" /></div><div class="settings-row"><div><strong>Dữ liệu demo</strong><p>Xóa thao tác đã lưu và khôi phục danh sách nghiên cứu, tài liệu, ghi nhớ ban đầu.</p></div><button class="danger" onclick="ui.resetConfirm()">${icon('refresh')} Đặt lại</button></div><div class="settings-row"><div><strong>Tích hợp backend</strong><p>Chưa có API, PostgreSQL, Docker hay n8n được kết nối vào bản demo.</p></div><span class="pill paused">Chưa kết nối</span></div></div></section>`}
function helpPage(){return `<section class="subpage">${heading('help','Hướng dẫn sử dụng demo','Một bản prototype tương tác để xem trước thiết kế trước khi tích hợp vào dự án thực tế.')}<div class="tile-grid">${[['home','Trang chủ','Mở 5 thẻ chức năng, hoạt động gần đây và truy cập nhanh.'],['research','Nghiên cứu mới','Tạo chủ đề trong hộp thoại, mở và cập nhật từng bước.'],['documents','Thư viện PDF','Chọn file PDF; demo ghi nhận metadata, không xử lý tệp thực.'],['chat','Chat tài liệu','Chọn PDF, nhập câu hỏi và nhận câu trả lời mẫu có citation.'],['memory','Memory','Duyệt, thu hồi hoặc loại bỏ ghi nhớ ở trạng thái chờ.'],['automations','n8n','Tạo lịch, tắt mở lịch, giả lập lượt chạy mà không gọi webhook.']].map(x=>`<article class="card tile"><h3>${x[1]}</h3><p>${x[2]}</p><button class="secondary btn-sm" onclick="ui.go('${x[0]}')">Mở mục ${icon('right')}</button></article>`).join('')}</div><div class="card panel-pad" style="margin-top:15px"><strong>Phím tắt:</strong><p class="muted" style="margin:8px 0 0">Ctrl + K để tìm kiếm, Ctrl + N để tạo nghiên cứu, Esc để đóng hộp thoại.</p></div></section>`}
function toast(message){if(!db.prefs.notify)return;const node=document.createElement('div');node.className='toast';node.innerHTML=`${icon('check')}<span>${esc(message)}</span>`;document.getElementById('toast').appendChild(node);setTimeout(()=>node.remove(),3900)}
function addActivity(title,detail,type='blue'){db.activities.unshift({type,title,detail,time:'Vừa xong'});db.activities=db.activities.slice(0,20);save()}
function modal(title,body,buttons=''){document.getElementById('overlay').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)ui.close()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" aria-label="Đóng" onclick="ui.close()">${icon('close')}</button></div><div class="modal-body">${body}</div>${buttons?`<div class="modal-foot">${buttons}</div>`:''}</div></div>`}
function close(){document.getElementById('overlay').innerHTML='';menuOpen='';const p=document.querySelector('.popover');if(p)p.remove()}
function realDate(){return new Date().toLocaleDateString('vi-VN')}
function newResearch(){modal('Tạo phiên nghiên cứu mới',`<form id="research-form" onsubmit="ui.createResearch(event)"><label class="field"><span>Chủ đề nghiên cứu *</span><input name="title" required maxlength="120" placeholder="Ví dụ: Ứng dụng AI trong giáo dục đại học" autofocus /></label><label class="field"><span>Lĩnh vực</span><select name="topic"><option>Trí tuệ nhân tạo</option><option>Giáo dục, công nghệ</option><option>Môi trường</option><option>Kinh tế và xã hội</option><option>Khác</option></select></label><label class="field"><span>Mức độ nghiên cứu</span><select name="depth"><option>Tiêu chuẩn</option><option>Chuyên sâu</option><option>Khảo sát nhanh</option></select></label><p class="small-note">Tạo phiên và tiến trình mẫu ở frontend, không thực hiện tìm kiếm internet thật.</p><div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="ghost" onclick="ui.close()">Hủy</button><button type="submit" class="primary">${icon('plus')} Tạo nghiên cứu</button></div></form>`)}
function createResearch(e){e.preventDefault();let f=new FormData(e.target);let name=String(f.get('title')).trim();if(!name)return;let s={id:Date.now(),title:name,date:realDate(),sources:0,status:'running',stage:0,image:'thumb2.webp',topic:f.get('topic')};db.sessions.unshift(s);selectedSession=s.id;addActivity('Tạo nghiên cứu mới',name);close();ui.go('detail');toast('Đã tạo phiên nghiên cứu mới trong bản demo')}
function advance(id){let s=db.sessions.find(x=>x.id===id);if(!s)return;if(s.stage>=3){let r=db.reports.find(x=>x.sessionId===id);if(!r){r={id:Date.now(),title:'Báo cáo: '+s.title,sessionId:id,date:realDate(),status:'ready'};db.reports.unshift(r);save()}ui.report(r.id);return}s.stage++;if(s.stage===1)s.sources=Math.max(6,s.sources);if(s.stage>=3){s.status='done';if(!db.reports.some(r=>r.sessionId===id))db.reports.unshift({id:Date.now(),title:'Báo cáo: '+s.title,sessionId:id,date:realDate(),status:'ready'})}addActivity('Cập nhật tiến trình nghiên cứu',s.title,s.stage>=3?'green':'blue');render();toast(s.stage>=3?'Đã hoàn thành phiên nghiên cứu':'Đã chuyển sang bước tiếp theo')}
function upload(){modal('Tải tài liệu PDF',`<label class="field"><span>Chọn file PDF từ máy tính</span><input type="file" id="modal-file" accept="application/pdf,.pdf" multiple onchange="ui.files(this.files)" /><small>Cho phép nhiều PDF; chỉ lưu metadata trong localStorage.</small></label><div style="background:#f5f9ff;border:1px solid #e2edf9;padding:12px;border-radius:10px;color:#6b7992;font-size:12px">${icon('shield')} Quyền riêng tư: không đọc, tải lên hay lưu nội dung thực của PDF ở demo này.</div>`,`<button class="ghost" onclick="ui.close()">Đóng</button>`)}
function processFiles(files){let added=0;for(const f of Array.from(files||[])){if(!(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'))){toast('Chỉ hỗ trợ tệp .pdf');continue}db.docs.unshift({id:Date.now()+Math.round(Math.random()*999),name:f.name,size:(f.size/1024/1024).toFixed(2)+' MB',date:realDate(),chunks:0,status:'demo'});added++}if(added){addActivity('Đã thêm '+added+' tài liệu PDF','Chờ kết nối backend để xử lý nội dung');close();view='documents';render();toast('Đã thêm '+added+' tệp PDF vào giao diện demo')}}
function sendChat(e){e.preventDefault();const input=e.target.querySelector('textarea');const question=input.value.trim();if(!question)return;db.messages.push({role:'you',text:question});const doc=selectedDoc==='all'?db.docs[0]:db.docs.find(x=>x.id===selectedDoc);const name=doc?.name||'Knowledge Workspace';let response=`Đây là câu trả lời mô phỏng cho câu hỏi: “${question}”.\n\nĐể trả lời chính xác với tài liệu “${name}”, phiên bản thật sẽ truy xuất các đoạn liên quan, tổng hợp bằng AI và trả về trích dẫn được kiểm chứng. Bạn có thể thử chọn một PDF khác và tiếp tục hội thoại.`;if(/tóm tắt|nội dung chính/i.test(question))response=`Tóm tắt minh họa của “${name}”:\n• Đối tượng và phạm vi nghiên cứu\n• Những luận điểm và bằng chứng nổi bật\n• Kết luận, hạn chế và hướng mở rộng\n\nBản demo chưa đọc nội dung PDF nên không khẳng định các ý trên đến từ tài liệu thực.`;db.messages.push({role:'bot',text:response,cite:name});addActivity('Phiên chat với tài liệu',question.slice(0,60),'violet');render()}
function newMemory(){modal('Thêm ghi nhớ mới',`<form id="memory-form" onsubmit="ui.createMemory(event)"><label class="field"><span>Tiêu đề *</span><input name="title" maxlength="100" required placeholder="Ví dụ: Ưu tiên nguồn học thuật" /></label><label class="field"><span>Nội dung ghi nhớ *</span><textarea name="description" maxlength="600" required placeholder="Nội dung kiến thức cần ghi nhớ..."></textarea></label><p class="small-note">Ghi nhớ mới ở trạng thái chờ duyệt, chưa tự động trở thành tri thức được sử dụng.</p><div style="display:flex;justify-content:flex-end;gap:8px"><button class="ghost" type="button" onclick="ui.close()">Hủy</button><button class="primary" type="submit">${icon('plus')} Thêm vào danh sách chờ</button></div></form>`)}
function createMemory(e){e.preventDefault();const f=new FormData(e.target);db.memories.unshift({id:Date.now(),title:String(f.get('title')).trim(),description:String(f.get('description')).trim(),date:realDate(),status:'pending'});addActivity('Đề xuất ghi nhớ mới',String(f.get('title')),'orange');close();render();toast('Đã thêm ghi nhớ chờ duyệt')}
function newSchedule(){modal('Tạo lịch chạy tự động',`<form onsubmit="ui.createSchedule(event)"><label class="field"><span>Tên lịch *</span><input name="title" required placeholder="Ví dụ: Tổng hợp nguồn mới hàng tuần" /></label><label class="field"><span>Tần suất</span><select name="frequency"><option>Mỗi ngày • 08:00</option><option>Thứ Hai • 08:00</option><option>Mỗi thứ Sáu • 18:00</option><option>Mỗi giờ</option></select></label><p class="small-note">Lịch chạy này chỉ tồn tại trong browser demo, không thực hiện cron trên n8n.</p><div style="display:flex;justify-content:flex-end;gap:8px"><button class="ghost" type="button" onclick="ui.close()">Hủy</button><button class="primary" type="submit">${icon('calendar')} Tạo lịch</button></div></form>`)}
function createSchedule(e){e.preventDefault();let f=new FormData(e.target);db.schedules.unshift({id:Date.now(),title:String(f.get('title')).trim(),frequency:String(f.get('frequency')),enabled:true,lastRun:'Chưa chạy'});addActivity('Tạo lịch tự động',String(f.get('title')),'orange');close();render();toast('Đã tạo lịch mô phỏng')}
function reportBody(r){const title=esc(r.title);return `<div style="border:1px solid #e8edf4;border-radius:10px;padding:19px;background:#fbfcff"><small class="muted">RESEARCHOS • BÁO CÁO MINH HỌA</small><h2 style="font-size:20px;margin:8px 0">${title}</h2><p class="muted">Ngày: ${r.date}</p><h3 style="font-size:14px">1. Tóm tắt</h3><p>Đây là bản nội dung minh họa để thử giao diện đọc và xuất báo cáo. Dữ liệu thực phải được lấy từ quy trình nghiên cứu, kết quả phân tích và các nguồn có thể kiểm chứng.</p><h3 style="font-size:14px">2. Phương pháp</h3><p>Lập kế hoạch, thu thập nguồn, đánh giá bằng chứng và tổng hợp kết quả.</p><h3 style="font-size:14px">3. Kết luận</h3><p>Chưa có kết luận thực tế nào được tạo tự động trong prototype này.</p></div>`}
function renderSearch(){const results=[...db.sessions.map(x=>({label:x.title,type:'Nghiên cứu',kind:'session',id:x.id})),...db.docs.map(x=>({label:x.name,type:'Tài liệu PDF',kind:'doc',id:x.id})),...db.reports.map(x=>({label:x.title,type:'Báo cáo',kind:'report',id:x.id}))];let val=(document.getElementById('global-query')?.value||'').toLocaleLowerCase();document.getElementById('search-results').innerHTML=results.filter(x=>x.label.toLocaleLowerCase().includes(val)).slice(0,12).map(x=>`<button class="search-result" onclick="ui.searchPick('${x.kind}',${x.id})">${icon(x.kind==='doc'?'file':x.kind==='report'?'book':'search')}<span style="flex:1">${esc(x.label)}</span><small class="muted">${x.type}</small></button>`).join('')||'<div class="empty">Không tìm thấy kết quả nào.</div>'}
const ui={go(id){view=id;mobileOpen=false;close();render();window.scrollTo({top:0,behavior:'instant'})},mobile(open){mobileOpen=open;render()},menu(){if(menuOpen){close();return}menuOpen='profile';const el=document.createElement('div');el.className='popover';el.innerHTML=`<button onclick="ui.go('settings')">${icon('settings')} Cài đặt</button><button onclick="ui.go('help')">${icon('help')} Hướng dẫn</button><button onclick="ui.resetConfirm()">${icon('refresh')} Đặt lại demo</button>`;document.body.appendChild(el)},notifications(){modal('Thông báo gần đây',`<div class="notification-list">${db.activities.slice(0,5).map(x=>`<div class="notification-item"><strong>${esc(x.title)}</strong><p>${esc(x.detail)} • ${esc(x.time)}</p></div>`).join('')}</div>`,`<button class="primary" onclick="ui.close()">Đã xem</button>`)},search(){document.getElementById('overlay').innerHTML=`<div class="modal-overlay search-overlay" onclick="if(event.target===this)ui.close()"><div class="search-dialog" role="dialog" aria-label="Tìm kiếm"><input id="global-query" class="search-input" autofocus placeholder="Tìm nghiên cứu, PDF, báo cáo..." oninput="ui.searchResults()"/><div id="search-results" class="search-results"></div><div class="search-shortcuts">↑ ↓ để xem kết quả • Nhấn Esc để đóng • Ctrl + N tạo nghiên cứu mới</div></div></div>`;renderSearch();document.getElementById('global-query').focus()},searchResults:renderSearch,searchPick(kind,id){close();if(kind==='session')ui.detail(id);else if(kind==='report')ui.report(id);else ui.selectDoc(id)},newResearch,createResearch,advance,detail(id){selectedSession=id;ui.go('detail')},sessionFilter(f){sessionFilter=f;render()},memoryFilter(f){memoryFilter=f;render()},evidence(i){let e=evidenceRecords[i];modal('Chi tiết bằng chứng',`<p><strong>${esc(e.source)}</strong></p><p class="muted">Loại: ${e.type}<br/>Độ tin cậy: ${e.quality}<br/>Số lần tham khảo (minh họa): ${e.citations}</p><p class="small-note">Bản demo chưa xác minh nguồn thực hay tải dữ liệu thư mục nghiên cứu.</p>`,`<button class="primary" onclick="ui.close()">Đóng</button>`)},mockAnalyze(){addActivity('Đã thực hiện phân tích mẫu','Kết quả mô phỏng hiển thị trên dashboard');render();toast('Phân tích mẫu hoàn tất; không gọi AI thật')},createReport(){let s=db.sessions[0];let r={id:Date.now(),title:'Báo cáo: '+s.title,sessionId:s.id,date:realDate(),status:'ready'};db.reports.unshift(r);addActivity('Tạo báo cáo mẫu',s.title,'green');render();toast('Đã tạo báo cáo minh họa')},report(id){const r=db.reports.find(x=>x.id===id);if(!r)return;modal('Xem báo cáo',reportBody(r),`<button class="ghost" onclick="ui.close()">Đóng</button><button class="primary" onclick="ui.downloadReport(${id})">${icon('download')} Xuất Markdown</button>`)},downloadReport(id){let r=db.reports.find(x=>x.id===id);if(!r)return;const content=`# ${r.title}\n\nNgày: ${r.date}\n\n> BÁO CÁO DEMO — Nội dung này không được tạo từ nghiên cứu thực.\n\n## 1. Tóm tắt\nNội dung minh họa cho giao diện xuất báo cáo ResearchOS.\n\n## 2. Phương pháp\nLập kế hoạch, thu thập nguồn, phân tích bằng chứng và tổng hợp.\n\n## 3. Kết luận\nChưa có dữ liệu thực.\n`;const blob=new Blob([content],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`researchos-report-${id}.md`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Đã xuất báo cáo Markdown mẫu')},upload,pickFile(){document.getElementById('file-picker').click()},files(f){processFiles(f)},drop(e){e.preventDefault();e.currentTarget.classList.remove('dragover');processFiles(e.dataTransfer.files)},selectDoc(id){selectedDoc=id;ui.go('chat')},docInfo(id){const d=db.docs.find(x=>x.id===id);if(!d)return;modal('Thông tin tài liệu',`<p><strong>${esc(d.name)}</strong></p><div class="settings-row"><strong>Kích thước</strong><span>${esc(d.size)}</span></div><div class="settings-row"><strong>Ngày thêm</strong><span>${esc(d.date)}</span></div><div class="settings-row"><strong>Đoạn tri thức</strong><span>${d.chunks||'Chưa có (demo)'}</span></div><p class="small-note">Thông số mẫu để trình bày giao diện.</p>`,`<button class="secondary" onclick="ui.selectDoc(${id})">${icon('message')} Chat tài liệu</button>`)},chatDoc(doc){selectedDoc=doc;render()},sendChat,newMemory,createMemory,approve(id){let m=db.memories.find(x=>x.id===id);if(m){m.status='approved';addActivity('Duyệt mục bộ nhớ',m.title,'green');render();toast('Đã duyệt ghi nhớ')}},unapprove(id){let m=db.memories.find(x=>x.id===id);if(m){m.status='pending';save();render();toast('Đã chuyển về chờ duyệt')}},reject(id){let m=db.memories.find(x=>x.id===id);if(m){db.memories=db.memories.filter(x=>x.id!==id);addActivity('Loại bỏ ghi nhớ',m.title,'orange');render();toast('Đã loại bỏ ghi nhớ')}},newSchedule,createSchedule,toggleSchedule(id,value){let x=db.schedules.find(x=>x.id===id);if(x){x.enabled=value;save();toast('Đã '+(value?'bật':'tắt')+' lịch mô phỏng')}},runSchedule(id){let x=db.schedules.find(x=>x.id===id);if(x){x.lastRun=realDate();addActivity('Chạy thử tự động hóa',x.title,'orange');render();toast('Đã ghi nhận lượt chạy mô phỏng (không gọi n8n)')}},pref(k,v){db.prefs[k]=v;save();document.body.classList.toggle('compact',db.prefs.compact);toast('Đã lưu tùy chọn demo')},resetConfirm(){close();modal('Khôi phục dữ liệu demo?',`<p>Thao tác này sẽ xóa các nghiên cứu, tệp PDF, chat, ghi nhớ và lịch chạy được thêm trong bản demo trên trình duyệt này.</p>`,`<button class="ghost" onclick="ui.close()">Hủy</button><button class="danger" onclick="ui.reset()">${icon('refresh')} Khôi phục</button>`)},reset(){db=structuredClone(seed);save();close();view='home';sessionFilter='all';memoryFilter='all';render();toast('Đã khôi phục dữ liệu ban đầu')},close};
window.ui=ui;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();ui.search()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();ui.newResearch()}});
document.addEventListener('click',e=>{if(menuOpen&&!e.target.closest('.userbtn')&&!e.target.closest('.popover'))close()});
document.body.classList.toggle('compact',db.prefs.compact);
render();
const picker=document.createElement('input');picker.type='file';picker.id='file-picker';picker.accept='.pdf,application/pdf';picker.multiple=true;picker.style.display='none';picker.addEventListener('change',e=>{processFiles(e.target.files);picker.value=''});document.body.appendChild(picker);
</script>
