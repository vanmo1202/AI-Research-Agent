  <script>
  const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];

  const sampleEvidence=[{source:'A Survey of Retrieval-Augmented Generation',score:'92%',tag:'Đã kiểm chứng',quote:'Hệ thống RAG kết hợp truy xuất ngữ cảnh bên ngoài với khả năng sinh văn bản, giúp câu trả lời có cơ sở tham chiếu rõ ràng hơn.'},{source:'Evaluating Faithfulness of LLMs',score:'86%',tag:'Cần đối chiếu',quote:'Việc trích dẫn một tài liệu không tự động đảm bảo rằng mọi phát biểu trong câu trả lời đều được nguồn đó hỗ trợ.'},{source:'Responsible AI in Education',score:'89%',tag:'Đã kiểm chứng',quote:'Chất lượng nghiên cứu phụ thuộc vào khả năng truy vết nguồn, quản lý sai lệch và sự tham gia của người đánh giá.'}];
  let docs=[...sampleDocs];let sampleHistory=[...sampleResearch];let memoryItems=[{title:'Độ tin cậy của citation',desc:'Luôn đối chiếu từng nhận định với đoạn trích gốc, không chỉ kiểm tra sự tồn tại của đường dẫn.',verified:true},{title:'Ưu tiên tài liệu học thuật',desc:'Khi tổng hợp nghiên cứu, xếp nguồn peer-reviewed trước bài blog và tài liệu tiếp thị.',verified:true},{title:'Chiến lược truy xuất lai',desc:'Kết hợp tìm kiếm theo từ khóa với phân đoạn ngữ nghĩa để tăng độ phủ trong tập PDF.',verified:false},{title:'Đánh giá độ mới của dữ liệu',desc:'Phân biệt nghiên cứu nền tảng với dữ liệu mang tính thời điểm trong phần báo cáo.',verified:false}];

  document.addEventListener('change',e=>{if(e.target.id==='pdf-file'){const f=e.target.files?.[0];if(!f)return;if(f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf'))return showToast('Vui lòng chọn tệp PDF.');docs.unshift({name:f.name,pages:0,size:(f.size/1024/1024).toFixed(1)+' MB',tag:'Mới thêm'});renderDocs($('#doc-search').value,'all');$$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.filter==='all'));showToast('Đã thêm tài liệu vào danh sách minh họa, chưa upload lên server.')}});
  document.addEventListener('click',e=>{const t=e.target.closest('.tab');if(t){$$('.tab').forEach(x=>x.classList.toggle('active',x===t));renderDocs($('#doc-search').value,t.dataset.filter)}if(e.target.closest('#new-chat')){$('#chat-thread').innerHTML='<div class="bubble assistant">Cuộc trò chuyện mới đã sẵn sàng. Hãy nhập câu hỏi của bạn.</div>'}if(e.target.closest('#export-report')){const data='ResearchOS — BẢN NHÁP MINH HỌA\n\nRetrieval-Augmented Generation trong nghiên cứu học thuật\n\nGiao diện mẫu, chưa có báo cáo thực từ backend.';const blob=new Blob([data],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='researchos-demo-report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);showToast('Đã xuất bản nháp minh họa.')}});
  $('#menu-btn').addEventListener('click',()=>{$('#sidebar').classList.toggle('open');$('#backdrop').classList.toggle('open')});$('#backdrop').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('open')});$('#bell').addEventListener('click',()=>showToast('Không có thông báo mới trong bản demo.'));$('#account-btn').addEventListener('click',()=>navigate('settings'));
  function renderPalette(query=''){const list=Object.entries(sections).filter(([k,v])=>v.toLowerCase().includes(query.toLowerCase())||k.includes(query.toLowerCase()));$('#command-results').innerHTML=list.length?list.map(([k,v])=>`<button class="palette-opt" data-action="${k}">${ico(({home:'home',research:'flask',library:'book',chat:'chat',evidence:'shield',reports:'file',memory:'brain',settings:'settings'})[k],18)} ${v} <span style="margin-left:auto;color:#9aaa9d;font-size:10px">↵</span></button>`).join(''):'<p class="empty">Không có trang phù hợp.</p>'}
  function openPalette(){$('#command-overlay').classList.remove('hidden');$('#command-input').value='';renderPalette();$('#command-input').focus()};function closePalette(){$('#command-overlay').classList.add('hidden')};$('#search-btn').addEventListener('click',openPalette);$('#command-close').addEventListener('click',closePalette);$('#command-overlay').addEventListener('click',e=>{if(e.target===$('#command-overlay'))closePalette()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(e.key==='Escape'){closePalette();$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('open')}});
  render();
  </script>
</body>
</html>
