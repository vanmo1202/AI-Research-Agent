      MOCK_LLM: 'true'
      MOCK_SEARCH: 'true'
      FRONTEND_ORIGIN: http://localhost:18080
  frontend:
    ports: !override ['127.0.0.1:18080:80']
  n8n:
    ports: !override ['127.0.0.1:15678:5678']
