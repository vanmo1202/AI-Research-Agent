x-backend: &backend
  image: ai-research-agent-backend:2.0.0
  build: ./backend
  env_file:
    - ./backend/.env
  environment: &backend-env
    PORT: 3000
    RESEARCH_DB_PATH: /app/data/research.db
    FRONTEND_ORIGIN: http://localhost:8080
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in root .env}
  volumes:
    - research_data:/app/data
  networks: [research]
  restart: unless-stopped

services:
  backend:
    <<: *backend
    ports: ['127.0.0.1:3000:3000']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  worker:
    <<: *backend
    command: ['npm', 'run', 'worker']
    stop_grace_period: 40s
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'node', 'src/workers/health.js']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  frontend:
    image: ai-research-agent-frontend:2.0.0
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ''
    ports: ['127.0.0.1:8080:80']
    depends_on:
      backend: {condition: service_healthy}
    networks: [research]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  n8n:
    image: n8nio/n8n:2.0.3
    ports: ['127.0.0.1:5678:5678']
    environment:
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      backend: {condition: service_healthy}
      worker: {condition: service_healthy}
    networks: [research]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:5678/healthz']
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
networks:
  research:
    driver: bridge
volumes:
  research_data:
  n8n_data:
