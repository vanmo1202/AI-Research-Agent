x-backend: &backend
  image: ai-research-agent-backend:2.0.0
  build: ./backend
  env_file:
    - ./backend/.env
  environment: &backend-env
    PORT: 3000
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: researchos
    PGDATABASE: researchos
    PGPASSWORD_FILE: /run/secrets/postgres_password
    DOCUMENT_STORAGE_PATH: /app/documents
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    TRUSTED_PROXY_CIDRS: ${FRONTEND_PROXY_IP:-172.30.240.2}/32
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    INTERNAL_RESEARCH_USER_ID: ${INTERNAL_RESEARCH_USER_ID:-}
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in root .env}
  volumes:
    - research_data:/app/data:ro
    - document_data:/app/documents
  secrets: [postgres_password]
  networks: [research]
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: researchos
      POSTGRES_DB: researchos
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [research]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U researchos -d researchos']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [node, src/db/migrate.js]
    restart: 'no'
    depends_on: {postgres: {condition: service_healthy}}
  backend:
    <<: *backend
    networks:
      research: {}
      browser_proxy:
        ipv4_address: ${BACKEND_PROXY_IP:-172.30.240.3}
    mem_limit: 512m
    depends_on: {migrate: {condition: service_completed_successfully}}
    ports: ['127.0.0.1:3000:3000']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  worker:
    <<: *backend
    mem_limit: 768m
    command: ['npm', 'run', 'worker']
    stop_grace_period: 60s
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'node', 'src/workers/health.js']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  frontend:
    mem_limit: 128m
    image: ai-research-agent-frontend:2.0.0
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ''
    ports: ['127.0.0.1:8080:80']
    depends_on:
      backend: {condition: service_healthy}
    networks:
      browser_proxy:
        ipv4_address: ${FRONTEND_PROXY_IP:-172.30.240.2}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  n8n:
    mem_limit: 1024m
    image: n8nio/n8n:2.46.1
    ports: ['127.0.0.1:5679:5678']
    environment:
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      backend: {condition: service_healthy}
      worker: {condition: service_healthy}
    networks: [research]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:5678/healthz']
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
networks:
  browser_proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${BROWSER_PROXY_SUBNET:-172.30.240.0/29}
  research:
    driver: bridge
volumes:
  research_data:
  document_data:
  n8n_data:
  postgres_data:

secrets:
  postgres_password:
    file: ./deploy/secrets/postgres_password
