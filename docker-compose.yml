services:
  backend:
    build:
      context: ./backend

    container_name: ai-research-backend

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    environment:
      PORT: 3000
      RESEARCH_DB_PATH: /app/data/research.db
      FRONTEND_ORIGIN: http://localhost:8080

    volumes:
      - research_data:/app/data

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000

    container_name: ai-research-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  research_data:
