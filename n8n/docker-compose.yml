# Legacy local helper only; production uses compose.production.yml.
# Applying this file recreates the service: operator approval and verified backup required.
services:
  n8n:
    image: n8nio/n8n:2.46.1
    container_name: ai-research-n8n

    ports:
      - "127.0.0.1:5678:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - n8n_data:/home/node/.n8n

    restart: unless-stopped

volumes:
  n8n_data: